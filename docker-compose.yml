# 「慎始」单机部署：直接拉取 CI 构建好的镜像，不在服务器上本地构建。
#
# 用法：
#   cp .env.example .env      # 然后在 .env 里填一个口令
#   docker compose pull && docker compose up -d
#   浏览器打开 http://<服务器地址>:8787
#
# 镜像由 GitHub Actions 在推送到 main 后构建并发布到 GHCR，amd64 / arm64 已合成
# 多架构 manifest，服务器是什么架构都拉同一个 tag；公开仓库的镜像可匿名拉取。
#
# 数据放在具名卷里而不是绑定挂载：具名卷由 Docker 按容器内用户归属初始化，天然无权限问题。
# 若确实想绑定挂载到宿主目录（如 ./data:/data），无需手动 chown —— 只要在下方 environment
# 里设 PUID / PGID 为宿主目录的属主 uid/gid，容器入口脚本会自动把 shenshi 用户改到该身份
# 并 chown /data，从而让 SQLite（WAL 模式，需对 /data 可写）正常写入。不设置时默认 1000:100。

services:
  shenshi:
    # 默认跟随 latest。要钉住某个版本就把 .env 里的 SHENSHI_TAG 设成对应的 commit sha。
    image: ghcr.io/felix2yu/shenshi:${SHENSHI_TAG:-latest}
    container_name: shenshi
    restart: unless-stopped

    # 想在服务器上自己构建时，注释掉上面的 image，改用下面两行（同目录 Dockerfile，三阶段构建）。
    # 注意这会要求服务器上具备完整的 Node / Go 构建环境，代价比拉镜像大得多。
    # build:
    #   context: .
    # image: shenshi:local

    ports:
      # 默认只监听所有网卡的 8787。若前面已有反向代理，改成 "127.0.0.1:8787:8787" 更稳妥。
      - "8787:8787"

    environment:
      # 时区直接决定「今天」「逾期」「习惯打卡」的归属日，务必与使用者一致。
      TZ: ${TZ:-Asia/Shanghai}
      SHENSHI_DB: /data/shenshi.db
      # 运行身份：绑定挂载到宿主目录时，设成宿主目录的属主 uid/gid，入口脚本会自动
      # chown /data，避免 SQLite 报 unable to open database file (14)。
      # 用 `id <你的用户>` 查宿主属主；不设则默认 1000:100。
      # PUID: ${PUID:-1000}
      # PGID: ${PGID:-100}
      # 访问口令。留空即不启用鉴权 —— 只适合完全可信的内网。
      # 用 `openssl rand -base64 24` 生成一个即可。
      SHENSHI_TOKEN: ${SHENSHI_TOKEN:?请先在 .env 设置 SHENSHI_TOKEN，或显式留空以关闭鉴权}

    volumes:
      - shenshi-data:/data

volumes:
  shenshi-data:
