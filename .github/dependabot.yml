version: 2
updates:
  # 后端 Go 依赖（go.mod 在 server/）
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 10

  # 前端 npm 依赖（package.json 在 web/）
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 10

  # Docker 基础镜像（node:24-alpine / golang:1.27-alpine / alpine:3.24）
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 10

  # GitHub Actions 工作流里用到的 action 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
