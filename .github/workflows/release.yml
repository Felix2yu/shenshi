name: Release

# 在 GitHub 上发布 release 时，交叉编译各平台二进制并挂到该 release 上。
#
# 四个目标平台都在同一个 Linux runner 上交叉编译：SQLite 驱动是纯 Go 实现，
# 构建期 CGO_ENABLED=0，产物完全静态、与编译机的 glibc 无关，
# 所以不需要为每个平台单开 runner，也就没有 glibc 版本那一类麻烦。

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: 编译各平台二进制
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 版本同样不在这里写死：与 build.yml 一致，读声明文件。
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 安装前端依赖
        run: npm ci
        working-directory: web

      # 前端产物要先落到 server/dist，go:embed 才编译得过。
      - name: 构建前端
        run: npm run build
        working-directory: web

      - name: 同步前端产物到 server/dist
        run: |
          rm -rf server/dist
          mkdir -p server/dist
          cp -R web/dist/. server/dist/

      # 发布前顺手跑一遍端到端，避免把一个坏掉的提交发出去。
      - name: 后端冒烟
        run: python3 scripts/smoke.py

      - name: 交叉编译
        working-directory: server
        run: |
          set -euo pipefail
          mkdir -p ../dist
          build() {
            local goos="$1" goarch="$2"
            echo "── ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "../dist/shenshi-${goos}-${goarch}" .
          }
          build linux amd64
          build linux arm64
          build darwin arm64
          build darwin amd64
          ls -lh ../dist

      # 二进制是用户直接下载运行的，把校验和一并附上，便于核对完整性。
      - name: 生成校验和
        working-directory: dist
        run: sha256sum shenshi-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: shenshi-binaries
          path: dist/*
          retention-days: 7

      - name: 挂到 release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/shenshi-*
            dist/SHA256SUMS.txt
