name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      # go.mod 在仓库根；//go:embed 位移至 internal/web（占位 .gitkeep 已提交），
      # 未构建前端时 ./... 也能编译通过
      go-dir: .
      test-packages: ./...
      web-dir: web

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: .
      main-package: ./cmd/shenshi
      binary-name: shenshi
      image-name: ghcr.io/felix2yu/shenshi
      web-dir: web
      # 前端产物必须落到 internal/web/dist：internal/web 用 go:embed all:dist 打包它
      frontend-stage-command: |
        mkdir -p internal/web/dist
        cp -R web/dist/. internal/web/dist/

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: .
      main-package: ./cmd/shenshi
      binary-name: shenshi
      web-dir: web
      frontend-stage-command: |
        mkdir -p internal/web/dist
        cp -R web/dist/. internal/web/dist/

  # 「慎始」特有的端到端冒烟不进公共 workflow，留在本地：
  # 真实 Chromium 走一遍主流程，并硬性要求「无控制台错误 / 无未捕获异常」。
  smoke:
    runs-on: ubuntu-26.04
    needs: test
    steps:
      - uses: actions/checkout@v7

      # 注：原「校验工具链声明一致」已移除——Dockerfile 改为装配式后不再声明
      # Node / Go 版本，脚本失去了校验对象。工具链版本现在唯一由
      # .nvmrc 与 go.mod 声明，CI 直接读这两份文件。
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: 前端类型检查
        run: pnpm exec tsc --noEmit
        working-directory: web

      # NLP 解析器出错不抛异常、只安静算错日期，用固定「今天」的确定性用例钉住
      - name: 自然语言解析回归
        run: node scripts/check-nlp.mjs
        working-directory: web

      # build.sh 产出 bin/shenshi（UI 冒烟的被测对象）与 internal/web/dist（供 go:embed）
      - name: 构建（前端 + 二进制）
        run: ./scripts/build.sh

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: 安装 Chromium
        run: pnpm exec playwright-core install --with-deps chromium
        working-directory: web

      - name: 后端冒烟
        run: python3 scripts/smoke.py

      - name: 浏览器 UI 冒烟
        run: node scripts/ui-smoke.mjs
        env:
          SHOT_DIR: ${{ github.workspace }}/screenshots

      - name: PWA 与离线冒烟
        run: node scripts/pwa-smoke.mjs
        env:
          SHOT_DIR: ${{ github.workspace }}/screenshots

      # 失败时截图是排查的主要线索，所以无论如何都传
      - name: 上传 UI 截图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: ${{ github.workspace }}/screenshots
          if-no-files-found: ignore
          retention-days: 7
