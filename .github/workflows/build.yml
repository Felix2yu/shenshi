name: Build

# 「慎始」的 SQLite 驱动是纯 Go 实现，`CGO_ENABLED=0` 出的是完全静态的二进制，
# 与编译机的 glibc 无关，因此：
#   ① 所有目标平台能在同一个 Linux runner 上交叉编译出来，不必为每个平台开 runner；
#   ② 不必把编译塞进固定版本的容器里，也不需要事后校验符号表。
# 于是 CI 只保留真正有价值的部分：跑测试、按架构出镜像。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 每周一次空跑：没人推代码也能暴露「依赖被上游删了 / 基础镜像没了」这类腐烂。
  # 依赖版本本身的例行检查交给 .github/dependabot.yml（每周五出 PR）。
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# 最小权限；docker job 需要写 packages，单独在该 job 里提权。
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # PR 上连着推多次时，旧的那次没必要跑完；main 上的构建不互相取消。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 工具链版本不在工作流里写死：下面两个 Setup 各自去读声明文件
      # （.nvmrc / server/go.mod），与本地开发、build.sh 用的是同一份来源。
      # 于是升级大版本只改声明，不必回来动 CI。
      #
      # 这条校验守的是另一件事：Dockerfile 的基镜像 tag 读不到这些文件，只能写死，
      # 是四处声明里唯一可能悄悄分叉的地方。dependabot 只提镜像大版本时会在这一步失败。
      - name: 校验工具链声明一致
        run: ./scripts/check-toolchain.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # 纯函数单测（重复规则推演、入库校验等），秒级，放在构建/冒烟之前快速失败。
      #
      # 只测 ./internal/...：main 包带着 //go:embed all:dist，而 dist 要到后面的
      # build.sh 才产出——这一步跑 ./... 会因「no matching files found」编译失败；
      # main 包本身也没有测试文件，排除掉不损失覆盖率。
      # -coverprofile 产出合并覆盖率文件，供下一步上传 Codecov。
      - name: 后端单元测试
        run: go test ./internal/... -coverprofile=coverage.out
        working-directory: server

      # 覆盖率上传 Codecov：仓库需在 Secrets 里配 CODECOV_TOKEN（codecov.io 接入时给出）。
      # fail_ci_if_error=false —— 没配 token（如 fork PR 拿不到 secrets）时只告警，
      # 不让覆盖率上传这种辅助信号反过来拦住 CI。
      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: server/coverage.out
          flags: unittests
          fail_ci_if_error: false

      - name: 安装前端依赖
        run: npm ci
        working-directory: web

      - name: 前端类型检查
        run: npx tsc --noEmit
        working-directory: web

      # NLP 解析器出错不抛异常、只安静算错日期，用固定「今天」的确定性用例钉住。
      - name: 自然语言解析回归
        run: node scripts/check-nlp.mjs
        working-directory: web

      # build.sh 会自动定位符合 .nvmrc / server/go.mod 的 node 与 go，并打印实际版本；
      # 它同时产出 bin/shenshi（UI 冒烟的被测对象）与 server/dist（供 go:embed）。
      - name: 构建（前端 + 二进制）
        run: ./scripts/build.sh

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # playwright-core 自带 install 子命令，不必为了下载浏览器再引入完整的 playwright 包。
      - name: 安装 Chromium
        run: npx playwright-core install --with-deps chromium
        working-directory: web

      # 后端端到端：自建临时实例与数据库，逐条验证核心接口。
      - name: 后端冒烟
        run: python3 scripts/smoke.py

      # 真实 Chromium 走一遍主流程，并硬性要求「无控制台错误 / 无未捕获异常」。
      - name: 浏览器 UI 冒烟
        run: node scripts/ui-smoke.mjs
        env:
          SHOT_DIR: ${{ github.workspace }}/screenshots

      # 失败时截图是排查的主要线索，所以无论如何都传。
      - name: 上传 UI 截图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: ${{ github.workspace }}/screenshots
          if-no-files-found: ignore
          retention-days: 7

  # 每个架构在自己的原生 runner 上构建：arm64 走到 QEMU 模拟的话，
  # 镜像里那次 Go 编译会被拖慢好几倍，而 arm64 runner 对公开仓库是免费的。
  docker:
    name: 镜像 ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04,     label: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像引用必须全小写，仓库名将来若含大写会在这里被纠正。
      - name: 仓库名转小写
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ matrix.label }}
          # 强制重新解析基础镜像 tag：alpine:3.24 背后的 digest 变了就重建，
          # 这样每周的空跑确实能把上游补丁带进来（比 CACHEBUST 参数更直接）。
          pull: true
          cache-from: type=gha,scope=${{ matrix.label }}
          cache-to: type=gha,scope=${{ matrix.label }},mode=max

  # 把两个架构的镜像合成一个多架构 manifest，拉取端不必关心自己在什么机器上。
  docker-manifest:
    name: 合并镜像 manifest
    runs-on: ubuntu-24.04
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 仓库名转小写
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 创建并推送 manifest
        run: |
          image=ghcr.io/${{ steps.repo.outputs.name }}
          docker buildx imagetools create \
            --tag "$image:latest" \
            "$image:amd64" "$image:arm64"
          docker buildx imagetools create \
            --tag "$image:${{ github.sha }}" \
            "$image:amd64" "$image:arm64"
