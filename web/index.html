<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 深浅两套 theme-color：装成主屏幕应用后，状态栏与多任务切换器里的着色跟着系统外观走，
         否则深色主题下顶部会留一条浅色状态栏。App 内切换主题时也会同步改写（见 AppStore.applyTheme）。 -->
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="慎始 · 慎始而敬终，行稳致远。一个注重规划与善始善终的任务管理应用。" />
    <link rel="icon" href="/icons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <!-- 32px 这一档单独给：小尺寸下内框线会糊，gen-icons.mjs 里它是关框 + 字放大到 0.80 的专用配方，
         比 favicon.ico 里那张 32 更清楚，留给不支持 SVG favicon 的老浏览器。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- 可安装（PWA）。断网时靠 Service Worker 回退缓存，详见 public/sw.js。 -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS / macOS Safari 的安装入口。
         apple-touch-icon 必须是 PNG 且不透明：iOS 认不下 SVG，
         也不接受透明通道（会被渲成黑底）。系统会自己按固定遮罩裁圆角，
         所以图本身是满幅正方形，不要预先裁。
         apple-mobile-web-app-capable 是 manifest 的 display 之前的旧开关，
         新版 Safari 已改读 manifest，这里留着兼容较老的 iOS。 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="慎始" />
    <!-- black-translucent：让页面延伸到状态栏之下，状态栏随主题着色，
         深色主题下不再是一条突兀的白条。代价是页面自己必须避开状态栏 ——
         主区、抽屉与详情浮层都加了 .pt-safe（env(safe-area-inset-top)）。
         老版本 iOS 若忽略这条 meta，env() 会报 0，也就不会多出留白。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <title>慎始 · 慎始而敬终</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
